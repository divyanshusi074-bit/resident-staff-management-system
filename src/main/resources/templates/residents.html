
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resident Management</title>

    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 25px;
            background: #f4f6f9;
            color: #222;
        }
        .container {
            max-width: 1200px;
            margin: auto;
        }
        h1, h2 { color: #243b55; }
        .panel {
            background: white;
            padding: 22px;
            margin-bottom: 22px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #00000012;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 15px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccd2d8;
            border-radius: 5px;
        }
        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 18px;
        }
        button, .btn {
            display: inline-block;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            color: white;
            background: #2457a7;
            cursor: pointer;
            font-size: 14px;
        }
        .secondary { background: #687582; }
        .danger { background: #c0392b; }
        .success-message {
            background: #d8f3df;
            color: #17632c;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 15px;
        }
        .error-message {
            color: #c0392b;
            font-size: 13px;
            margin-top: 5px;
        }
        .error-box {
            background: #fde8e7;
            color: #a52822;
            padding: 12px;
            border-radius: 5px;
            margin: 12px 0;
        }
        .search-form {
            display: flex;
            gap: 10px;
        }
        .search-form input { flex: 1; }
        .table-wrapper { overflow-x: auto; }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 750px;
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid #e1e5e9;
            text-align: left;
        }
        th { background: #edf1f5; }
        td .btn { margin: 2px; }
        @media (max-width: 650px) {
            body { padding: 12px; }
            .form-grid { grid-template-columns: 1fr; }
            .search-form { flex-wrap: wrap; }
        }
    </style>
</head>

<body>
<div class="container">

    <h1>Resident Management</h1>

    <div class="panel">
        <a class="btn secondary" th:href="@{/}">Dashboard</a>
        <a class="btn secondary" th:href="@{/staff}">Staff Management</a>
    </div>

    <div th:if="${successMessage}" class="success-message"
         th:text="${successMessage}"></div>

    <div class="panel">
        <h2 th:text="${editMode} ? 'Edit Resident' : 'Add New Resident'">
            Add New Resident
        </h2>

        <form th:action="@{/residents/save}"
              th:object="${resident}" method="post">

            <input type="hidden" th:field="*{id}">

            <div class="form-grid">

                <div>
                    <label for="name">Full Name</label>
                    <input id="name" type="text" th:field="*{name}"
                           placeholder="Enter resident name" required>
                    <div class="error-message"
                         th:if="${#fields.hasErrors('name')}"
                         th:errors="*{name}"></div>
                </div>

                <div>
                    <label for="email">Email Address</label>
                    <input id="email" type="email" th:field="*{email}"
                           placeholder="Enter email address" required>
                    <div class="error-message"
                         th:if="${#fields.hasErrors('email')}"
                         th:errors="*{email}"></div>
                    <div class="error-message"
                         th:if="${emailError}" th:text="${emailError}"></div>
                </div>

                <div>
                    <label for="phone">Phone Number</label>
                    <input id="phone" type="tel" th:field="*{phone}"
                           placeholder="10-digit phone number"
                           pattern="[0-9]{10}" maxlength="10" required>
                    <div class="error-message"
                         th:if="${#fields.hasErrors('phone')}"
                         th:errors="*{phone}"></div>
                </div>

                <div>
                    <label for="flatNumber">Flat Number</label>
                    <input id="flatNumber" type="text"
                           th:field="*{flatNumber}"
                           placeholder="Enter flat number" required>
                    <div class="error-message"
                         th:if="${#fields.hasErrors('flatNumber')}"
                         th:errors="*{flatNumber}"></div>
                </div>

                <div>
                    <label for="password">Password</label>
                    <input id="password" type="password"
                           th:field="*{password}"
                           placeholder="Enter password" required>
                    <div class="error-message"
                         th:if="${#fields.hasErrors('password')}"
                         th:errors="*{password}"></div>
                </div>

            </div>

            <div class="actions">
                <button type="submit"
                        th:text="${editMode} ? 'Update Resident' : 'Add Resident'">
                    Add Resident
                </button>
                <a class="btn secondary" th:href="@{/residents}">Reset Form</a>
            </div>
        </form>
    </div>

    <div class="panel">
        <h2>Search Residents</h2>
        <form class="search-form" th:action="@{/residents/search}" method="get">
            <input type="text" name="keyword"
                   placeholder="Search residents..."
                   th:value="${keyword}">
            <button type="submit">Search</button>
            <a class="btn secondary" th:href="@{/residents}">Show All</a>
        </form>
    </div>

    <div class="panel">
        <h2>Resident List</h2>

        <div class="table-wrapper">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Flat Number</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="r : ${residents}">
                    <td th:text="${r.id}"></td>
                    <td th:text="${r.name}"></td>
                    <td th:text="${r.email}"></td>
                    <td th:text="${r.phone}"></td>
                    <td th:text="${r.flatNumber}"></td>
                    <td>
                        <a class="btn" th:href="@{/residents/view/{id}(id=${r.id})}">
                            View
                        </a>
                        <a class="btn secondary"
                           th:href="@{/residents/edit/{id}(id=${r.id})}">
                            Edit
                        </a>
                        <a class="btn danger"
                           th:href="@{/residents/delete/{id}(id=${r.id})}"
                           onclick="return confirm('Are you sure you want to delete this resident?');">
                            Delete
                        </a>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(residents)}">
                    <td colspan="6">No residents found.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
</body>
</html>
