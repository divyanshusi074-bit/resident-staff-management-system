<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Management System</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            width: 400px;
            background: white;

            padding: 40px;

            border-radius: 15px;

            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.10);

            text-align: center;
        }

        .login-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        h1 {
            color: #1f2937;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 30px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;

            font-weight: bold;
            color: #374151;
        }

        input {
            width: 100%;

            padding: 13px;

            border: 1px solid #d1d5db;
            border-radius: 7px;

            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        .login-btn {
            width: 100%;

            padding: 13px;

            border: none;
            border-radius: 7px;

            background: #2563eb;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;

            padding: 10px;

            border-radius: 6px;

            margin-bottom: 20px;

            font-size: 14px;
        }

        @media (max-width: 500px) {

            .login-card {
                width: 90%;
                padding: 30px;
            }

        }

    </style>

</head>

<body>

<div class="login-card">

    <div class="login-icon">
        🔐
    </div>

    <h1>
        Management System
    </h1>

    <p class="subtitle">
        Admin Login
    </p>

    <!-- Error Message -->

    <div
            th:if="${param.error}"
            class="error">

        Invalid username or password

    </div>

    <form
            th:action="@{/login}"
            method="post">

        <div class="form-group">

            <label>
                Username
            </label>

            <input
                    type="text"
                    name="username"
                    placeholder="Enter username"
                    required>

        </div>

        <div class="form-group">

            <label>
                Password
            </label>

            <input
                    type="password"
                    name="password"
                    placeholder="Enter password"
                    required>

        </div>

        <button
                type="submit"
                class="login-btn">

            Login

        </button>

    </form>

</div>

</body>

</html>
